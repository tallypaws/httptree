name: Publish

on:
  push:
    branches: [main]
    paths:
      - "pkg/**"
      - "ext/**"
  workflow_dispatch:

concurrency: publish

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: node scripts/publish-changed.mjs
