lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      httptree:
        specifier: file:./pkg
        version: '@tally.paws/httptree@file:pkg'

packages:

  '@tally.paws/httptree@file:pkg':
    resolution: {directory: pkg, type: directory}
    engines: {node: '>=18'}
    peerDependencies:
      busboy: ^1.6.0
      ws: ^8.0.0
    peerDependenciesMeta:
      busboy:
        optional: true
      ws:
        optional: true

snapshots:

  '@tally.paws/httptree@file:pkg': {}
